# Правки из облачных сессий Claude (телефон) приходят в ветки claude/*.
# Сайт собирается из main, поэтому каждая такая ветка сразу вливается в main.
name: Правки с телефона → боевая версия

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Влить ветку в main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin main

      # Пуш от имени Actions сам по себе может не запустить сборку Pages — просим явно
      - name: Пересобрать сайт
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Сборку не удалось запросить, Pages соберёт сайт по пушу"
